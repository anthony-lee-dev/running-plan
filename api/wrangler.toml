name = "running-plan-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "running-plan"
# Created with: npx wrangler d1 create running-plan  (a fork creates its own and pastes its id here)
database_id = "de6e398f-66f1-4b78-9822-b37db7178773"
migrations_dir = "migrations"

# Cloudflare Email Sending (public beta, Workers Paid). Onboard the sender domain in the dashboard first.
[[send_email]]
name = "EMAIL"

# The web app (web/, built with `npm run build -w web`) is served from this same Worker so the page and /v1 share one
# origin: no CORS, and the strict CSP (connect-src 'self') stays. Only /v1/* runs the Worker; every other path is a
# static asset (web/dist/_headers sets the security headers on them), with the SPA fallback to index.html.
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/v1/*"]

# Workers AI rewords run summaries (issue #132). Free pool: 10,000 neurons a day, one pool for all models, resets 00:00 UTC.
# Local `wrangler dev` calls it remotely and spends neurons; tests use a stub and never reach it.
[ai]
binding = "AI"

[vars]
# AI run summaries: "on" or "off". Ships "on" by the human's decision on 2026-11-11 after the device check.
# "off" plus a deploy is the kill switch: it shows the template text and never calls the model.
# AI_DAILY_CAP (model calls a day across all accounts, default 600) stays under the free pool; raise it only on Workers Paid.
AI_SUMMARIES = "on"
