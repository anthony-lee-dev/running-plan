name: api-ci
# Required check "api" on main. No path filter: a required check must report on every PR,
# or PRs that don't touch the API would wait for it forever.
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  api:
    name: api
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bash scripts/verify.sh spec api
      # Fails a PR that adds or upgrades to a dependency with a high or critical advisory (any scope).
      # Inside the required "api" job so it blocks merges without a ruleset change.
      - name: dependency review
        # Runs even when verify failed, so a red PR still shows its dependency result.
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
