name: ios-ci
# Required check "ios" on main. Runs on every PR (see api-ci for why) but only builds
# when something the iOS build or its UI tests use changed (list in "Decide whether to build"), so other PRs pass in seconds.
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Decides whether the iOS build matters; cheap, so the required check can always report.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.changes.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Decide whether to build
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ ! -f ios/project.yml ]]; then
            echo "No iOS project yet; nothing to build."; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Only what the iOS build and UI tests use: the app and its tests, the contract the client is generated
          # from, the in-memory API the UI tests run against (api/test/ui-server imports only api/src), its
          # migrations and packages, and the scripts that run it. Markdown never counts.
          if git diff --quiet "$BASE" HEAD -- \
            ios spec api/src api/test/ui-server api/migrations api/package.json api/tsconfig.json \
            package.json package-lock.json scripts/verify.sh scripts/generate-api-client.sh .github/workflows/ios-ci.yml \
            ':(exclude,glob)**/*.md' 2>/dev/null; then
            echo "iOS untouched."; echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  # The suite is split over five parallel runners (five is the most macOS jobs a public repo runs at once): the unit
  # tests and the UI test classes dealt out by their measured times (see ios_shard_filters in scripts/verify.sh,
  # which finds the classes itself, so a new class is never left out).
  ios-test:
    name: ios-test (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/5", "2/5", "3/5", "4/5", "5/5"]
    steps:
      - uses: actions/checkout@v7
      - name: Select the newest Xcode on the runner
        id: xcode
        run: |
          xc="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [[ -n "$xc" ]]; then sudo xcode-select -s "$xc"; fi
          xcodebuild -version
          echo "version=$(xcodebuild -version | tr -s ' \n' '--')" >> "$GITHUB_OUTPUT"
      # The UI tests run against the API on Node (api/test/ui-server), started by verify.sh.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install npm packages
        run: npm ci
      - name: Install XcodeGen
        run: brew install xcodegen
      # Caches only speed the build up; a miss rebuilds from scratch. The generator is compiled by
      # `swift run` in generate-api-client.sh (about 2 minutes cold). DerivedData restores the newest earlier
      # build, so Xcode only recompiles what changed.
      - uses: actions/cache@v6
        with:
          path: ios/APIClientGenerator/.build
          key: apiclient-generator-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('ios/APIClientGenerator/Package.resolved', 'ios/APIClientGenerator/Package.swift') }}
      # Every run restores the newest DerivedData for this Xcode; only main saves one, so PR runs
      # don't fill the repo's cache quota.
      - uses: actions/cache/restore@v6
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: deriveddata-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('ios/project.yml', 'ios/APIClient/Package.swift') }}-${{ github.sha }}
          restore-keys: |
            deriveddata-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('ios/project.yml', 'ios/APIClient/Package.swift') }}-
      - name: Verify
        env:
          IOS_SHARD: ${{ matrix.shard }}
          IOS_HANG_RETRIES: "1"
          IOS_RESULT_BUNDLE: ${{ runner.temp }}/ios.xcresult
          # A shard takes about 10 minutes, so one that runs past 18 is hung: verify stops it, restarts the
          # simulator and runs it once more, all inside the job's 45-minute limit.
          IOS_TEST_TIMEOUT: "1080"
        run: bash scripts/verify.sh ios
      # Per-test times and failure messages (xcodebuild -quiet prints neither).
      - name: Slowest tests and failures
        if: always()
        run: |
          b="$RUNNER_TEMP/ios.xcresult"
          [[ -d "$b" ]] || exit 0
          xcrun xcresulttool get test-results tests --path "$b" | jq -r '
            [.. | objects | select(.nodeType == "Test Case")] | sort_by(.durationInSeconds // 0) | reverse | .[:12][]
            | "\(.result)\t\(.durationInSeconds // 0)s\t\(.name)" ' || true
          xcrun xcresulttool get test-results tests --path "$b" | jq -r '
            [.. | objects | select(.nodeType == "Failure Message")] | .[] | "FAILURE: \(.name)"' || true
      - uses: actions/cache/save@v6
        if: github.event_name == 'push' && matrix.shard == '1/5'
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: deriveddata-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('ios/project.yml', 'ios/APIClient/Package.swift') }}-${{ github.sha }}

  # The required check. Passes when the iOS build did not matter, or when every shard passed.
  ios:
    name: ios
    needs: [changes, ios-test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report
        env:
          RUN: ${{ needs.changes.outputs.run }}
          CHANGES: ${{ needs.changes.result }}
          TESTS: ${{ needs.ios-test.result }}
        run: |
          echo "changes=$CHANGES run=$RUN ios-test=$TESTS"
          [[ "$CHANGES" == success ]] || { echo "Could not decide whether to build"; exit 1; }
          if [[ "$RUN" == true ]]; then
            [[ "$TESTS" == success ]] || { echo "iOS tests: $TESTS"; exit 1; }
          else
            echo "iOS untouched; nothing to build."
          fi
