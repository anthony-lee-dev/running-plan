name: ios-ci
# Required check "ios" on main. Runs on every PR (see api-ci for why) but only builds
# when something the iOS build or its UI tests use changed (list in "Decide whether to build"), so other PRs pass in seconds.
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Decides whether the iOS build matters; cheap, so the required check can always report.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.changes.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Decide whether to build
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ ! -f ios/project.yml ]]; then
            echo "No iOS project yet; nothing to build."; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Only what the iOS build and UI tests use: the app and its tests, the contract the client is generated
          # from, the in-memory API the UI tests run against (api/test/ui-server imports only api/src), its
          # migrations and packages, and the scripts that run it. Markdown never counts.
          if git diff --quiet "$BASE" HEAD -- \
            ios spec designs/dark/png api/src api/test/ui-server api/migrations api/package.json api/tsconfig.json \
            package.json package-lock.json scripts/verify.sh scripts/generate-api-client.sh .github/workflows/ios-ci.yml \
            ':(exclude,glob)**/*.md' 2>/dev/null; then
            echo "iOS untouched."; echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  # Builds once for every shard: the app and both test bundles, with the API client check and the project generation.
  # The products go to the shards as an artifact, so each shard only installs and runs tests.
  build:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      IOS_DERIVED_DATA: ~/Library/Developer/Xcode/DerivedData/ci
    steps:
      - uses: actions/checkout@v7
      - name: Select the newest Xcode on the runner
        id: xcode
        run: |
          xc="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [[ -n "$xc" ]]; then sudo xcode-select -s "$xc"; fi
          xcodebuild -version
          echo "version=$(xcodebuild -version | tr -s ' \n' '--')" >> "$GITHUB_OUTPUT"
      - name: Install XcodeGen
        run: brew install xcodegen
      # Caches only speed the build up; a miss rebuilds from scratch. The generator is compiled by
      # `swift run` in generate-api-client.sh (about 2 minutes cold). DerivedData restores the newest earlier
      # build, so Xcode only recompiles what changed; only main saves one, so PR runs don't fill the quota.
      - uses: actions/cache@v6
        with:
          path: ios/APIClientGenerator/.build
          key: apiclient-generator-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('ios/APIClientGenerator/Package.resolved', 'ios/APIClientGenerator/Package.swift') }}
      - uses: actions/cache/restore@v6
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: deriveddata-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('ios/project.yml', 'ios/APIClient/Package.swift') }}-${{ github.sha }}
          restore-keys: |
            deriveddata-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('ios/project.yml', 'ios/APIClient/Package.swift') }}-
      - name: Build for testing
        run: |
          export IOS_DERIVED_DATA="${IOS_DERIVED_DATA/#\~/$HOME}"
          IOS_PHASE=build bash scripts/verify.sh ios
          tar -C "$IOS_DERIVED_DATA/Build" -czf "$RUNNER_TEMP/ios-products.tgz" Products
          ls -lh "$RUNNER_TEMP/ios-products.tgz"
      - uses: actions/upload-artifact@v4
        with:
          name: ios-products
          path: ${{ runner.temp }}/ios-products.tgz
          retention-days: 1
          compression-level: 0
      - uses: actions/cache/save@v6
        if: github.event_name == 'push'
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: deriveddata-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('ios/project.yml', 'ios/APIClient/Package.swift') }}-${{ github.sha }}

  # The suite is split over three runners (see ios_shard_filters in scripts/verify.sh, which finds the UI test classes
  # itself, so a new class is never left out) and runs from the build above without building again.
  ios-test:
    name: ios-test (${{ matrix.shard }})
    needs: [changes, build]
    if: needs.changes.outputs.run == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]
    steps:
      - uses: actions/checkout@v7
      - name: Select the newest Xcode on the runner
        run: |
          xc="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [[ -n "$xc" ]]; then sudo xcode-select -s "$xc"; fi
          xcodebuild -version
      # The UI tests run against the API on Node (api/test/ui-server), started by verify.sh.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install npm packages
        run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: ios-products
          path: ${{ runner.temp }}/artifact
      - name: Unpack the build
        run: tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/artifact/ios-products.tgz"
      - name: Test
        env:
          IOS_PHASE: test
          IOS_PRODUCTS: ${{ runner.temp }}/Products
          IOS_SHARD: ${{ matrix.shard }}
          IOS_HANG_RETRIES: "1"
          IOS_TEST_ALLOWANCE: "300"
          # Start the app once before the tests (its first launch on a fresh simulator is the one that times out), and
          # run again only the tests that failed with "Timed out while launching application via Xcode".
          IOS_WARM_UP: "1"
          IOS_LAUNCH_RETRIES: "1"
          IOS_RESULT_BUNDLE: ${{ runner.temp }}/ios.xcresult
          # A shard takes about 10 to 15 minutes and one test is stopped after 5 (IOS_TEST_ALLOWANCE), so a shard
          # past 25 is hung: verify stops it, restarts the simulator and runs it once more, inside the 45-minute limit.
          IOS_TEST_TIMEOUT: "1500"
        run: bash scripts/verify.sh ios
      # Per-test times and failure messages (xcodebuild -quiet prints neither).
      - name: Slowest tests and failures
        if: always()
        run: |
          b="$RUNNER_TEMP/ios.xcresult"
          # A first run whose launch timeouts were retried (verify.sh keeps it as ios-first.xcresult).
          if [[ -d "$RUNNER_TEMP/ios-first.xcresult" ]]; then
            echo "RETRIED (the app did not launch):"
            xcrun xcresulttool get test-results tests --path "$RUNNER_TEMP/ios-first.xcresult" | jq -r '
              [.. | objects | select(.nodeType == "Failure Message")] | .[] | "RETRIED: \(.name)"' || true
          fi
          [[ -d "$b" ]] || exit 0
          # Every test with its class and seconds, so IOS_SHARD_WEIGHTS can be kept balanced.
          xcrun xcresulttool get test-results tests --path "$b" | jq -r '
            def cases($suite): if .nodeType == "Test Case" then {s: $suite, r: .result, d: (.durationInSeconds // 0), n: .name}
              else (.children // [])[] | cases(if .nodeType == "Test Suite" then .name else $suite end) end;
            [.testNodes[] | cases("")] | sort_by(.d) | reverse | .[] | "\(.r)\t\(.d|floor)s\t\(.s)\t\(.n)" ' || true
          xcrun xcresulttool get test-results tests --path "$b" | jq -r '
            [.. | objects | select(.nodeType == "Failure Message")] | .[] | "FAILURE: \(.name)"' || true

  # The required check. Passes when the iOS build did not matter, or when every shard passed.
  ios:
    name: ios
    needs: [changes, build, ios-test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report
        env:
          RUN: ${{ needs.changes.outputs.run }}
          CHANGES: ${{ needs.changes.result }}
          BUILD: ${{ needs.build.result }}
          TESTS: ${{ needs.ios-test.result }}
        run: |
          echo "changes=$CHANGES run=$RUN build=$BUILD ios-test=$TESTS"
          [[ "$CHANGES" == success ]] || { echo "Could not decide whether to build"; exit 1; }
          if [[ "$RUN" == true ]]; then
            [[ "$BUILD" == success ]] || { echo "iOS build: $BUILD"; exit 1; }
            [[ "$TESTS" == success ]] || { echo "iOS tests: $TESTS"; exit 1; }
          else
            echo "iOS untouched; nothing to build."
          fi
