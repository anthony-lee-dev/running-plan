name: RunningPlan
options:
  bundleIdPrefix: ca.anthonylee
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  RunningPlan:
    type: application
    platform: iOS
    sources: [RunningPlan]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.anthonylee.runningplan$(BUNDLE_ID_SUFFIX)
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Running Plan
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
  RunningPlanTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RunningPlanTests]
    dependencies:
      - target: RunningPlan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.anthonylee.runningplan$(BUNDLE_ID_SUFFIX).tests
        GENERATE_INFOPLIST_FILE: YES
  RunningPlanUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [RunningPlanUITests]
    dependencies:
      - target: RunningPlan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.anthonylee.runningplan$(BUNDLE_ID_SUFFIX).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: RunningPlan
schemes:
  RunningPlan:
    build:
      targets:
        RunningPlan: all
    test:
      targets:
        - RunningPlanTests
        - RunningPlanUITests
