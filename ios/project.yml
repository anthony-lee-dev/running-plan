name: RunningPlan
options:
  bundleIdPrefix: ca.anthonylee
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
packages:
  APIClient:
    path: APIClient
  # Declared here too because the app and the unit tests link and name the runtime's transport and HTTP types directly.
  swift-openapi-urlsession:
    url: https://github.com/apple/swift-openapi-urlsession
    from: 1.1.0
  swift-openapi-runtime:
    url: https://github.com/apple/swift-openapi-runtime
    from: 1.13.0
  swift-http-types:
    url: https://github.com/apple/swift-http-types
    from: 1.3.0
targets:
  RunningPlan:
    type: application
    platform: iOS
    sources: [RunningPlan]
    dependencies:
      - package: APIClient
        product: APIClient
      - package: swift-openapi-runtime
        product: OpenAPIRuntime
      - package: swift-openapi-urlsession
        product: OpenAPIURLSession
      - package: swift-http-types
        product: HTTPTypes
    entitlements:
      path: RunningPlan/RunningPlan.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.anthonylee.runningplan$(BUNDLE_ID_SUFFIX)
        INFOPLIST_KEY_NSHealthShareUsageDescription: Running Plan reads your runs from Health to compare them with your plan, and schedules planned workouts on your Apple Watch.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: Running Plan schedules planned workouts on your Apple Watch.
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Running Plan
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
  RunningPlanTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RunningPlanTests]
    dependencies:
      - target: RunningPlan
      - package: APIClient
        product: APIClient
      - package: swift-openapi-runtime
        product: OpenAPIRuntime
      - package: swift-http-types
        product: HTTPTypes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.anthonylee.runningplan$(BUNDLE_ID_SUFFIX).tests
        GENERATE_INFOPLIST_FILE: YES
  RunningPlanUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [RunningPlanUITests]
    dependencies:
      - target: RunningPlan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.anthonylee.runningplan$(BUNDLE_ID_SUFFIX).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: RunningPlan
schemes:
  RunningPlan:
    build:
      targets:
        RunningPlan: all
    test:
      targets:
        - RunningPlanTests
        - RunningPlanUITests
